name: Update Typst

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:

  check-update:
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v7

      - name: Get current version
        id: current
        run: echo "version=$(grep -oP 'TYPST_VERSION=\K[0-9.]+' Dockerfile)" >> "$GITHUB_OUTPUT"

      - name: Get latest release
        id: latest
        run: |
          latest=$(gh release view --repo typst/typst --json tagName -q '.tagName' | sed 's/^v//')
          echo "version=$latest" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve matching typst-pptx release
        id: pptx
        if: steps.current.outputs.version != steps.latest.outputs.version
        run: |
          tag=$(gh release list --repo Steve19802/typst-pptx --limit 50 \
                  --json tagName,name --jq \
                  '.[] | select(.name | contains("(typst ${{ steps.latest.outputs.version }})")) | .tagName' \
                | head -1)
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Dockerfile
        if: steps.current.outputs.version != steps.latest.outputs.version
        run: |
          sed -i "s/TYPST_VERSION=${{ steps.current.outputs.version }}/TYPST_VERSION=${{ steps.latest.outputs.version }}/" Dockerfile
          if [ -n "${{ steps.pptx.outputs.version }}" ]; then
            sed -i "s/ARG TYPST_PPTX_VERSION=.*/ARG TYPST_PPTX_VERSION=${{ steps.pptx.outputs.version }}/" Dockerfile
          fi

      - name: Create PR
        if: steps.current.outputs.version != steps.latest.outputs.version
        uses: peter-evans/create-pull-request@v8
        with:
          branch: deps/typst-${{ steps.latest.outputs.version }}
          title: 'Update Typst to ${{ steps.latest.outputs.version }}'
          body: |
            Updates Typst from `${{ steps.current.outputs.version }}` to `${{ steps.latest.outputs.version }}`.
            Also bumps `typst-pptx` to `${{ steps.pptx.outputs.version }}` so the PowerPoint exporter stays paired with Typst.

            Release: https://github.com/typst/typst/releases/tag/v${{ steps.latest.outputs.version }}
          commit-message: 'Update Typst to ${{ steps.latest.outputs.version }}'
